name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Core library tests
        run: ./gradlew --stacktrace :fit-core:test

      - name: CLI
        run: ./gradlew :cli:fatJar

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Screenshots
        run: ./gradlew :app:recordRoborazziDebug

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Smoke-test the CLI on real FIT files
        run: |
          mkdir -p /tmp/gpx
          java -jar cli/build/libs/fitgpx-cli.jar -o /tmp/gpx fit-core/src/test/resources/fit
          ls -la /tmp/gpx

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: fitgpx-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/src/test/screenshots/*.png
          if-no-files-found: warn

      - name: Upload CLI
        uses: actions/upload-artifact@v7
        with:
          name: fitgpx-cli
          path: cli/build/libs/fitgpx-cli.jar

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
