name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # only used to publish the screenshots branch from main
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Core library tests
        run: .github/scripts/gradle.sh :fit-core:test

      - name: CLI
        run: .github/scripts/gradle.sh :cli:fatJar

      - name: App unit tests
        run: .github/scripts/gradle.sh --continue :app:testDebugUnitTest

      - name: Screenshots
        run: .github/scripts/gradle.sh :app:recordRoborazziDebug

      - name: Lint
        run: .github/scripts/gradle.sh :app:lintDebug

      - name: Build APKs
        run: .github/scripts/gradle.sh :app:assembleDebug :app:assembleRelease

      - name: Smoke-test the CLI on real FIT files
        run: |
          mkdir -p /tmp/gpx
          java -jar cli/build/libs/fitgpx-cli.jar -o /tmp/gpx fit-core/src/test/resources/fit
          ls -la /tmp/gpx

      - name: Publish screenshots to the ci/screenshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$(mktemp -d)"
          cp app/src/test/screenshots/*.png "$out"/
          cd "$out"
          git init -q -b ci/screenshots
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/screenshots

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: fitgpx-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/src/test/screenshots/*.png
          if-no-files-found: warn

      - name: Upload CLI
        uses: actions/upload-artifact@v7
        with:
          name: fitgpx-cli
          path: cli/build/libs/fitgpx-cli.jar

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

  device:
    name: Emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # only used to publish the device screenshots branch from main
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: .github/scripts/gradle.sh :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global hide_error_dialogs 1
            .github/scripts/gradle.sh :app:connectedDebugAndroidTest; status=$?; mkdir -p device-shots; adb pull /data/local/tmp/fitgpx-shots/. device-shots/ || true; exit $status

      - name: Publish device screenshots to the ci/device-screenshots branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls device-shots/*.png >/dev/null 2>&1 || { echo "No device screenshots"; exit 0; }
          out="$(mktemp -d)"
          cp device-shots/*.png "$out"/
          cd "$out"
          git init -q -b ci/device-screenshots
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Device screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/device-screenshots
